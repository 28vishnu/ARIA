name: JARVIS backend checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'brain/knowledge/**'
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/jarvis-backend-checks.yml'
  pull_request:
    paths:
      - 'brain/knowledge/**'
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/jarvis-backend-checks.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate Python imports and syntax
        run: python -m compileall -q .
      - name: Run complete test suite
        run: python -m pytest -q --junitxml=test-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-backend-test-report
          path: test-report.xml
          if-no-files-found: ignore
          retention-days: 14
