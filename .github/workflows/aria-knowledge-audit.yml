name: ARIA Knowledge Audit

on: workflow_dispatch

permissions:
contents: read

jobs:
knowledge-audit:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install test dependency
    run: python -m pip install pytest

  - name: Verify audit files
    run: |
      test -f brain/knowledge/jarvis_acceptance.py
      test -f tests/test_jarvis_acceptance.py

  - name: Run audit unit tests
    run: python -m pytest -q tests/test_jarvis_acceptance.py

  - name: Create temporary audit database
    run: |
      python - <<'PY'
      import sqlite3
      import os

      path = os.path.join(os.environ["RUNNER_TEMP"], "aria-ci.sqlite3")
      with sqlite3.connect(path) as conn:
          conn.execute("""
              CREATE TABLE documents (
                  id INTEGER PRIMARY KEY,
                  source TEXT NOT NULL,
                  source_id TEXT NOT NULL,
                  title TEXT NOT NULL,
                  content TEXT NOT NULL,
                  url TEXT NOT NULL,
                  license TEXT NOT NULL
              )
          """)
          conn.executemany(
              "INSERT INTO documents "
              "(source, source_id, title, content, url, license) "
              "VALUES (?, ?, ?, ?, ?, ?)",
              [
                  ("wiki", "1", "Test topic one", "Test content one", "https://example.org/1", "CC BY-SA"),
                  ("docs", "2", "Test topic two", "Test content two", "https://example.org/2", "MIT"),
              ],
          )
      print("Temporary test database created.")
      PY

  - name: Run structural knowledge audit
    run: |
      python -m brain.knowledge.jarvis_acceptance \
        --db "$RUNNER_TEMP/aria-ci.sqlite3" --json

  - name: Run full test suite
    run: python -m pytest -q