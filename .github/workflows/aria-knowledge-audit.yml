```yaml
name: "ARIA Knowledge Audit"

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Check audit module exists
        run: |
          test -f brain/knowledge/jarvis_acceptance.py
          test -f tests/test_jarvis_acceptance.py

      - name: Run knowledge audit
        run: python -m brain.knowledge.jarvis_acceptance --json

      - name: Run tests
        run: python -m pytest -q
```
