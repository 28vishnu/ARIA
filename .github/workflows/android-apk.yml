
name: Build and publish ARIA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project
        shell: bash
        run: |
          test -f android/settings.gradle -o -f android/settings.gradle.kts || {
            echo "ERROR: android/settings.gradle or settings.gradle.kts is missing."
            find android -maxdepth 3 -type f -print
            exit 1
          }
          test -f android/app/build.gradle -o -f android/app/build.gradle.kts || {
            echo "ERROR: Android app Gradle build file is missing."
            exit 1
          }

      - name: Check release-signing secrets
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          test -n "$ARIA_KEYSTORE_BASE64" || { echo "Missing ARIA_KEYSTORE_BASE64"; exit 1; }
          test -n "$ARIA_KEYSTORE_PASSWORD" || { echo "Missing ARIA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ARIA_KEY_ALIAS" || { echo "Missing ARIA_KEY_ALIAS"; exit 1; }
          test -n "$ARIA_KEY_PASSWORD" || { echo "Missing ARIA_KEY_PASSWORD"; exit 1; }

      - name: Restore signing key
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ARIA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aria-upload-key.jks"
          test -s "$RUNNER_TEMP/aria-upload-key.jks"

      - name: Build signed APK
        shell: bash
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ARIA_KEYSTORE_PATH: ${{ runner.temp }}/aria-upload-key.jks
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease
          APK_PATH="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH" || { echo "ERROR: Release APK was not generated."; exit 1; }
          cp "$APK_PATH" "$GITHUB_WORKSPACE/aria.apk"

      - name: Create version metadata
        shell: bash
        run: |
          printf '{"versionCode":%s,"versionName":"1.0.%s","apkUrl":"https://github.com/28vishnu/ARIA/releases/latest/download/aria.apk"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > version.json

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: ARIA Android 1.0.${{ github.run_number }}
          body: 'Automatically built ARIA Android APK.'
          make_latest: true
          files: |
            aria.apk
            version.json
