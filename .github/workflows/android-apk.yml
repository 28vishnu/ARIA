
name: Build and publish ARIA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/settings.gradle -o \
               -f android/settings.gradle.kts || {
            echo "ERROR: Android settings.gradle is missing."
            exit 1
          }

          test -f android/app/build.gradle -o \
               -f android/app/build.gradle.kts || {
            echo "ERROR: Android app build.gradle is missing."
            exit 1
          }

          test -f android/app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml is missing."
            exit 1
          }

      - name: Validate signing secrets
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in \
            ARIA_KEYSTORE_BASE64 \
            ARIA_KEYSTORE_PASSWORD \
            ARIA_KEY_ALIAS \
            ARIA_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "ERROR: Required secret is missing or empty: $name"
              exit 1
            fi
            echo "$name is present"
          done

      - name: Restore signing key
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ARIA_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/aria-upload-key.jks"

          test -s "$RUNNER_TEMP/aria-upload-key.jks"
          echo "Keystore restored."

      - name: Diagnose signing configuration
        shell: bash
        env:
          ARIA_KEYSTORE_PATH: ${{ runner.temp }}/aria-upload-key.jks
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -s "$ARIA_KEYSTORE_PATH" || {
            echo "ERROR: Keystore file is missing."
            exit 1
          }

          for name in \
            ARIA_KEYSTORE_PATH \
            ARIA_KEYSTORE_PASSWORD \
            ARIA_KEY_ALIAS \
            ARIA_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name is missing or empty."
              exit 1
            fi
            echo "$name is present"
          done

      - name: Build signed release APK
        shell: bash
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ARIA_KEYSTORE_PATH: ${{ runner.temp }}/aria-upload-key.jks
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle --no-daemon clean assembleRelease

          APK_PATH="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/release-output/aria.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -s release-output/aria.apk
          unzip -t release-output/aria.apk >/dev/null
          sha256sum release-output/aria.apk

      - name: Create version metadata
        shell: bash
        run: |
          set -euo pipefail

          printf \
            '{"versionCode":%s,"versionName":"1.0.%s","apkUrl":"https://github.com/28vishnu/ARIA/releases/latest/download/aria.apk"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" \
            > release-output/version.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: ARIA Android 1.0.${{ github.run_number }}
          body: 'Automated ARIA Android release. APK archive validation passed.'
          make_latest: true
          files: |
            release-output/aria.apk
            release-output/version.json
