name: Build and publish ARIA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "ERROR: Android sdkmanager was not found."; exit 1; }
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android:name=".AriaGlassActivity"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' android/app/src/main/AndroidManifest.xml

      - name: Validate signing secrets
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ARIA_KEYSTORE_BASE64 ARIA_KEYSTORE_PASSWORD ARIA_KEY_ALIAS ARIA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "ERROR: Required secret is missing: $name"; exit 1; fi
            echo "$name is present"
          done

      - name: Restore signing key
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ARIA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aria-upload-key.jks"
          test -s "$RUNNER_TEMP/aria-upload-key.jks"

      - name: Build signed release APK
        shell: bash
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ARIA_KEYSTORE_PATH: ${{ runner.temp }}/aria-upload-key.jks
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease
          APK_PATH="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH" || { echo "ERROR: Release APK was not generated."; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/release-output"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/release-output/aria.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s release-output/aria.apk
          unzip -t release-output/aria.apk >/dev/null
          sha256sum release-output/aria.apk

      # Preserve a downloadable APK even when GitHub's Releases API has a 5xx outage.
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-android-apk-${{ github.run_number }}
          path: |
            release-output/aria.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create version metadata
        shell: bash
        run: |
          set -euo pipefail
          printf '{"versionCode":%s,"versionName":"1.0.%s","apkUrl":"https://github.com/28vishnu/ARIA/releases/latest/download/aria.apk"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > release-output/version.json

      - name: Upload version metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-version-metadata-${{ github.run_number }}
          path: release-output/version.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with retries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          TITLE="ARIA Android 1.0.${GITHUB_RUN_NUMBER}"
          NOTES="Automated ARIA Android release. APK archive validation passed. If the release is unavailable, download the APK from this workflow's Artifacts section."
          for attempt in 1 2 3 4 5; do
            echo "Publishing release attempt ${attempt}/5 for ${TAG}..."
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" release-output/aria.apk release-output/version.json --clobber && \
                 gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest; then
                echo "Release updated successfully."
                exit 0
              fi
            else
              if gh release create "$TAG" release-output/aria.apk release-output/version.json \
                --title "$TITLE" --notes "$NOTES" --latest; then
                echo "Release created successfully."
                exit 0
              fi
            fi
            sleep_seconds=$((attempt * 4))
            echo "Release API failed; retrying in ${sleep_seconds}s. The APK workflow artifact is already uploaded."
            sleep "$sleep_seconds"
          done
          echo "WARNING: GitHub Release API failed after retries. The APK is still available in Actions > this run > Artifacts."
          # Do not mark a successfully compiled and uploaded APK as a build failure
          # solely because GitHub Releases returned a transient 5xx.
          exit 0
