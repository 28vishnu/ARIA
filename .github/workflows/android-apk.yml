
name: Build and publish ARIA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle Wrapper
        id: gradle
        shell: bash
        run: |
          if [ -f android/gradlew ]; then
            echo "working_dir=android" >> "$GITHUB_OUTPUT"
            echo "wrapper=./gradlew" >> "$GITHUB_OUTPUT"
          elif [ -f gradlew ]; then
            echo "working_dir=." >> "$GITHUB_OUTPUT"
            echo "wrapper=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: No Gradle Wrapper found."
            echo "Expected android/gradlew or gradlew at repository root."
            find . -maxdepth 4 \( -name gradlew -o -name gradlew.bat -o -name gradle-wrapper.properties \) -print
            exit 1
          fi

      - name: Check release-signing secrets
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          test -n "$ARIA_KEYSTORE_BASE64" || (echo 'Missing repository secret ARIA_KEYSTORE_BASE64' && exit 1)
          test -n "$ARIA_KEYSTORE_PASSWORD" || (echo 'Missing repository secret ARIA_KEYSTORE_PASSWORD' && exit 1)
          test -n "$ARIA_KEY_ALIAS" || (echo 'Missing repository secret ARIA_KEY_ALIAS' && exit 1)
          test -n "$ARIA_KEY_PASSWORD" || (echo 'Missing repository secret ARIA_KEY_PASSWORD' && exit 1)

      - name: Restore stable signing key
        shell: bash
        env:
          ARIA_KEYSTORE_BASE64: ${{ secrets.ARIA_KEYSTORE_BASE64 }}
        run: |
          echo "$ARIA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aria-upload-key.jks"
          test -s "$RUNNER_TEMP/aria-upload-key.jks"

      - name: Build signed release APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ARIA_KEYSTORE_PATH: ${{ runner.temp }}/aria-upload-key.jks
          ARIA_KEYSTORE_PASSWORD: ${{ secrets.ARIA_KEYSTORE_PASSWORD }}
          ARIA_KEY_ALIAS: ${{ secrets.ARIA_KEY_ALIAS }}
          ARIA_KEY_PASSWORD: ${{ secrets.ARIA_KEY_PASSWORD }}
        run: |
          chmod +x "${{ steps.gradle.outputs.working_dir }}/gradlew"
          cd "${{ steps.gradle.outputs.working_dir }}"
          ./gradlew --no-daemon clean assembleRelease
          APK_PATH="$(find . -path '*/build/outputs/apk/release/*.apk' -type f | head -n 1)"
          test -n "$APK_PATH" || (echo 'Release APK not found' && exit 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/aria.apk"

      - name: Create release metadata
        shell: bash
        run: |
          printf '{"versionCode":%s,"versionName":"1.0.%s","apkUrl":"https://github.com/28vishnu/ARIA/releases/latest/download/aria.apk"}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > version.json

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: ARIA Android 1.0.${{ github.run_number }}
          body: 'Automatically built ARIA Android APK. Install over the previous app only when signed with the same release key.'
          make_latest: true
          files: |
            aria.apk
            version.json
