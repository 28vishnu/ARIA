
plugins {
    id 'com.android.application'
}

def readEnv = { String name ->
    String value = System.getenv(name)
    return value == null ? '' : value.trim()
}

android {
    namespace 'com.aria.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aria.assistant'
        minSdk 23
        targetSdk 35

        versionCode (readEnv('VERSION_CODE') ?: '1').toInteger()
        versionName readEnv('VERSION_NAME') ?: '1.0.0'
    }

    signingConfigs {
        release {
            def storePath = readEnv('ARIA_KEYSTORE_PATH')
            def storePass = readEnv('ARIA_KEYSTORE_PASSWORD')
            def aliasValue = readEnv('ARIA_KEY_ALIAS')
            def keyPass = readEnv('ARIA_KEY_PASSWORD')

            if (!storePath || !storePass || !aliasValue || !keyPass) {
                throw new GradleException(
                    'Release signing is incomplete. Check ARIA_KEYSTORE_PATH, ARIA_KEYSTORE_PASSWORD, ARIA_KEY_ALIAS and ARIA_KEY_PASSWORD.'
                )
            }

            def keyFile = file(storePath)

            if (!keyFile.exists() || !keyFile.isFile()) {
                throw new GradleException(
                    'The release keystore file does not exist at ARIA_KEYSTORE_PATH.'
                )
            }

            storeFile keyFile
            storePassword storePass
            keyAlias aliasValue
            keyPassword keyPass
        }
    }

    buildTypes {
        debug {
        }

        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
