
plugins {
    id 'com.android.application'
}

def envValue = { String name ->
    def value = System.getenv(name)
    return value == null ? '' : value.trim()
}

android {
    namespace 'com.aria.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aria.assistant'
        minSdk 23
        targetSdk 35
        versionCode (envValue('VERSION_CODE') ?: '1').toInteger()
        versionName envValue('VERSION_NAME') ?: '1.0.0'
    }

    def storeFilePath = envValue('ARIA_KEYSTORE_PATH')
    def storePasswordValue = envValue('ARIA_KEYSTORE_PASSWORD')
    def keyAliasValue = envValue('ARIA_KEY_ALIAS')
    def keyPasswordValue = envValue('ARIA_KEY_PASSWORD')

    signingConfigs {
        if (storeFilePath && storePasswordValue &&
            keyAliasValue && keyPasswordValue) {
            release {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
        }

        release {
            minifyEnabled false

            if (storeFilePath && storePasswordValue &&
                keyAliasValue && keyPasswordValue) {
                signingConfig signingConfigs.release
            } else {
                throw new GradleException(
                    'Release signing configuration is incomplete. Check the four ARIA signing secrets in GitHub Actions.'
                )
            }
        }
    }
}
