plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aria.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aria.assistant'
        minSdk 23
        targetSdk 35
        versionCode (System.getenv('VERSION_CODE') ?: '1').toInteger()
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ARIA_KEYSTORE_PATH')
            if (storeFilePath != null && !storeFilePath.isEmpty()) {
                storeFile file(storeFilePath)
                storePassword System.getenv('ARIA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ARIA_KEY_ALIAS')
                keyPassword System.getenv('ARIA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Debug builds remain for local testing; published APKs use the stable release key.
        }
        release {
            minifyEnabled false
            if (System.getenv('ARIA_KEYSTORE_PATH') != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}
