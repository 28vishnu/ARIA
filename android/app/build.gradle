
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aria.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aria.assistant'
        minSdk 23
        targetSdk 35
        versionCode (System.getenv('VERSION_CODE') ?: '1').toInteger()
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
    }

    buildTypes {
        debug {
            // Debug builds use the default debug signing configuration.
        }

        release {
            minifyEnabled false

            def storeFilePath = System.getenv('ARIA_KEYSTORE_PATH')
            def storePasswordValue = System.getenv('ARIA_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('ARIA_KEY_ALIAS')
            def keyPasswordValue = System.getenv('ARIA_KEY_PASSWORD')

            if (storeFilePath) {
                if (!storePasswordValue || !keyAliasValue || !keyPasswordValue) {
                    throw new GradleException(
                        'Release signing is enabled, but one or more signing environment variables are missing.'
                    )
                }

                def signingFile = file(storeFilePath)
                if (!signingFile.exists() || !signingFile.isFile()) {
                    throw new GradleException(
                        'Release keystore file was not found at ARIA_KEYSTORE_PATH.'
                    )
                }

                signingConfigs {
                    release {
                        storeFile signingFile
                        storePassword storePasswordValue
                        keyAlias keyAliasValue
                        keyPassword keyPasswordValue
                    }
                }

                signingConfig signingConfigs.release
            } else {
                throw new GradleException(
                    'ARIA_KEYSTORE_PATH is missing. Configure the four GitHub Actions signing secrets before building a release APK.'
                )
            }
        }
    }
}
